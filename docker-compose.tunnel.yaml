name: affine
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/toeverything/affine-graphql:latest
    container_name: affine-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: affine-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PORT: 3010
      NODE_ENV: production
      NODE_OPTIONS: --import=./scripts/register.js
      AFFINE_CONFIG_PATH: /root/.affine/config
      AFFINE_SERVER_EXTERNAL_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      AFFINE_ADMIN_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      AFFINE_ADMIN_PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      DATABASE_URL: postgres://${DB_USER_NAME:-affine}:${DB_USER_PASS:-replace-with-a-random-password}@affine-db:5432/${DB_CREATE_DATABASE_NAME:-affine}
      REDIS_SERVER_HOST: affine-redis
      REDIS_SERVER_PORT: 6379
      TELEMETRY_ENABLE: 'false'
    volumes:
      - './volumes/data/affine:/root/.affine/storage'
      - './volumes/config/affine:/root/.affine/config'
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://affine-app:3010'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - affine
      - cloudflare

  db:
    image: postgres:latest
    container_name: affine-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: affine-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: affine-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-affine}
      POSTGRES_USER: ${DB_USER_NAME:-affine}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      POSTGRES_ADMIN_USER: ${DB_ADMIN_NAME:-postgres}
      POSTGRES_ADMIN_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/affine:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - affine

  redis:
    image: redis:alpine
    container_name: affine-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: affine-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: affine-redis
    volumes:
      - './volumes/cache/redis/affine:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affine

networks:
  affine:
    name: affine
    external: false
  cloudflare:
    external: true
