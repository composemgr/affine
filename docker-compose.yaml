# nginx proxy address - http://172.17.0.1:64104

name: affine
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: affine-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PORT: 3010
      NODE_ENV: production
      DEPLOYMENT_TYPE: selfhosted
      AFFINE_CONFIG_PATH: /root/.affine/config
      AFFINE_SERVER_EXTERNAL_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      DATABASE_URL: postgres://${DB_USER_NAME:-affine}:${DB_USER_PASS:-replace-with-a-random-password}@affine-db:5432/${DB_CREATE_DATABASE_NAME:-affine}
      REDIS_SERVER_HOST: affine-redis
      REDIS_SERVER_PORT: 6379
      TELEMETRY_ENABLE: 'false'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3010']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64104:3010'
    volumes:
      - './volumes/data/affine:/root/.affine/storage'
      - './volumes/config/affine:/root/.affine/config'
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - affine

  migration:
    image: ghcr.io/toeverything/affine:stable
    container_name: affine-migration
    restart: 'no'
    pull_policy: always
    logging: *default-logging
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: affine-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PORT: 3010
      NODE_ENV: production
      DEPLOYMENT_TYPE: selfhosted
      AFFINE_CONFIG_PATH: /root/.affine/config
      AFFINE_SERVER_EXTERNAL_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      DATABASE_URL: postgres://${DB_USER_NAME:-affine}:${DB_USER_PASS:-replace-with-a-random-password}@affine-db:5432/${DB_CREATE_DATABASE_NAME:-affine}
      REDIS_SERVER_HOST: affine-redis
      REDIS_SERVER_PORT: 6379
      TELEMETRY_ENABLE: 'false'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3010']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/affine:/root/.affine/storage'
      - './volumes/config/affine:/root/.affine/config'
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - affine

  db:
    image: pgvector/pgvector:pg16
    container_name: affine-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: affine-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: affine-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-affine}
      POSTGRES_USER: ${DB_USER_NAME:-affine}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      POSTGRES_ADMIN_USER: ${DB_ADMIN_NAME:-postgres}
      POSTGRES_ADMIN_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/affine:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - affine

  redis:
    image: redis:alpine
    container_name: affine-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: affine-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: affine-redis
    volumes:
      - './volumes/cache/redis/affine:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affine

networks:
  affine:
    name: affine
    external: false
